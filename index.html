<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Turnos 24h PWA</title>
    
    <!-- Favicon e Icono para Pantalla de Inicio / PWA (Logo 24h Azul) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='128' fill='%232563eb'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='220'>24h</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='128' fill='%232563eb'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-weight='900' font-size='220'>24h</text></svg>">
    <meta name="theme-color" content="#2563eb">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase Cloud Firestore SDK for Real-time Cloud Sync -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuración y conexión dinámica a la nube
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'turnos-24h-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            // Iniciar sesión anónima o con token para sincronización segura
            const authInit = typeof __initial_auth_token !== 'undefined' && __initial_auth_token
                ? signInWithCustomToken(auth, __initial_auth_token)
                : signInAnonymously(auth);

            authInit.then(() => {
                window.cloudDB = db;
                window.cloudAppId = appId;

                // Escuchar solicitudes de permutas en tiempo real para todo el grupo
                const colSolicitudes = collection(db, 'artifacts', appId, 'public', 'data', 'solicitudes');
                onSnapshot(colSolicitudes, (snapshot) => {
                    const lista = [];
                    snapshot.forEach(docSnap => {
                        lista.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    // Ordenar por timestamp
                    lista.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    state.solicitudes = lista;
                    renderizarApp();
                }, (err) => console.log('Sincronización solicitudes:', err));

                // Escuchar excepciones / cambios de turno en tiempo real
                const colExcepciones = collection(db, 'artifacts', appId, 'public', 'data', 'excepciones');
                onSnapshot(colExcepciones, (snapshot) => {
                    const mapa = {};
                    snapshot.forEach(docSnap => {
                        mapa[docSnap.id] = docSnap.data();
                    });
                    state.excepciones = mapa;
                    renderizarApp();
                }, (err) => console.log('Sincronización excepciones:', err));
            });
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar for clean UI */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <!-- App Container -->
    <div id="app" class="max-w-4xl w-full mx-auto flex-grow flex flex-col bg-white min-h-screen shadow-xl relative">
        <!-- Renderizado dinámico vía JavaScript -->
    </div>

    <!-- Modales -->
    <!-- Modal Solicitud Permuta / Cambio de Turno -->
    <div id="modalSolicitud" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl transform transition-all relative">
            <button onclick="cerrarModal('modalSolicitud')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            
            <div class="flex items-center space-x-3 mb-4">
                <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center font-bold">
                    <i data-lucide="repeat" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-slate-900">Solicitar Permuta</h3>
                    <p class="text-xs text-slate-500">Cambio directo entre dos compañeros</p>
                </div>
            </div>

            <form id="formSolicitud" onsubmit="procesarSolicitudCambio(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Mi Guardia (Fecha A)</label>
                    <input type="date" id="fechaSolicitante" oninput="validarPermutaEnTiempoReal()" onchange="validarPermutaEnTiempoReal()" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Compañero Destino</label>
                    <select id="empleadoDestino" onchange="validarPermutaEnTiempoReal()" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                        <!-- Opciones generadas por JS -->
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Su Guardia (Fecha B)</label>
                    <input type="date" id="fechaDestino" oninput="validarPermutaEnTiempoReal()" onchange="validarPermutaEnTiempoReal()" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Motivo (Opcional)</label>
                    <textarea id="motivoSolicitud" rows="2" placeholder="Ej: Asunto personal, evento familiar..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 text-sm"></textarea>
                </div>

                <!-- Mensaje de Validación de Error -->
                <div id="errorValidacionPermuta" class="hidden bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl p-3 flex items-start space-x-2">
                    <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5 text-rose-500"></i>
                    <span id="textoErrorValidacion">Comprueba las fechas seleccionadas.</span>
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="cerrarModal('modalSolicitud')" class="px-4 py-2.5 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700 hover:bg-slate-50 transition">Cancelar</button>
                    <button type="submit" id="btnEnviarSolicitud" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-md transition disabled:opacity-50 disabled:cursor-not-allowed">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Editar Excepción (Solo Admin) -->
    <div id="modalExcepcion" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
            <button onclick="cerrarModal('modalExcepcion')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <h3 class="text-lg font-bold text-slate-900 mb-1">Ajuste / Excepción de Turno</h3>
            <p id="subtituloExcepcion" class="text-xs text-slate-500 mb-4">Modificar guardia manualmente</p>

            <form onsubmit="guardarExcepcion(event)" class="space-y-4">
                <input type="hidden" id="fechaExcepcion">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Empleado Asignado</label>
                    <select id="selectEmpleadoExcepcion" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500">
                        <!-- Generado por JS -->
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Notas / Motivo del Cambio</label>
                    <input type="text" id="notaExcepcion" placeholder="Ej: Sustitución por baja médica" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button type="button" onclick="eliminarExcepcion()" class="px-3.5 py-2 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-medium">Restablecer Original</button>
                    <div class="space-x-2">
                        <button type="button" onclick="cerrarModal('modalExcepcion')" class="px-4 py-2 rounded-xl border border-slate-300 text-xs font-semibold text-slate-700">Cancelar</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-md">Guardar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Principal App -->
    <script>
        // --- 1. CONFIGURACIÓN Y ESTADO INICIAL ---
        const CONFIG = {
            // Fecha ancla oficial: Ciclo rotativo de 6 días
            fechaBase: '2026-01-01',
            empleados: [
                { id: 1, nombre: 'Ana Gómez', iniciales: 'AG', color: 'bg-emerald-500', badge: 'bg-emerald-100 text-emerald-800' },
                { id: 2, nombre: 'Carlos Ruiz', iniciales: 'CR', color: 'bg-blue-500', badge: 'bg-blue-100 text-blue-800' },
                { id: 3, nombre: 'David López', iniciales: 'DL', color: 'bg-purple-500', badge: 'bg-purple-100 text-purple-800' },
                { id: 4, nombre: 'Elena Sanz', iniciales: 'ES', color: 'bg-amber-500', badge: 'bg-amber-100 text-amber-800' },
                { id: 5, nombre: 'Fernando Gil', iniciales: 'FG', color: 'bg-rose-500', badge: 'bg-rose-100 text-rose-800' },
                { id: 6, nombre: 'Gloria Marín', iniciales: 'GM', color: 'bg-cyan-500', badge: 'bg-cyan-100 text-cyan-800' }
            ]
        };

        // Estado global de la app
        let state = {
            usuarioActualId: 2, // Por defecto Carlos Ruiz
            esAdmin: false,
            mesActual: new Date().getMonth(),
            añoActual: new Date().getFullYear(),
            excepciones: JSON.parse(localStorage.getItem('turnos_excepciones') || '{}'),
            solicitudes: JSON.parse(localStorage.getItem('turnos_solicitudes') || '[]')
        };

        function guardarEstado() {
            localStorage.setItem('turnos_excepciones', JSON.stringify(state.excepciones));
            localStorage.setItem('turnos_solicitudes', JSON.stringify(state.solicitudes));
        }

        // Formateadores auxiliares de fechas
        function formatearFechaCorta(fechaStr) {
            if (!fechaStr) return '';
            const [y, m, d] = fechaStr.split('-');
            return `${d}/${m}/${y}`;
        }

        function formatearFechaLarga(fechaStr) {
            if (!fechaStr) return '';
            const [y, m, d] = fechaStr.split('-').map(Number);
            const fecha = new Date(y, m - 1, d);
            return fecha.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        // --- 2. CÁLCULO DE CICLO Y TURNOS ---
        function obtenerEmpleadoAsignadoOriginal(fechaStr) {
            const [y, m, d] = fechaStr.split('-').map(Number);
            const fTarget = new Date(y, m - 1, d);
            
            const [bY, bM, bD] = CONFIG.fechaBase.split('-').map(Number);
            const fBase = new Date(bY, bM - 1, bD);

            const diffTime = fTarget.getTime() - fBase.getTime();
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
            
            let index = diffDays % CONFIG.empleados.length;
            if (index < 0) index += CONFIG.empleados.length;
            return CONFIG.empleados[index];
        }

        function obtenerEmpleadoFecha(fechaStr) {
            if (state.excepciones[fechaStr]) {
                const empId = state.excepciones[fechaStr].empleadoId;
                return CONFIG.empleados.find(e => e.id === empId) || obtenerEmpleadoAsignadoOriginal(fechaStr);
            }
            return obtenerEmpleadoAsignadoOriginal(fechaStr);
        }

        // --- 3. RENDERIZADO DE LA INTERFAZ ---
        function renderizarApp() {
            const app = document.getElementById('app');
            const empActual = CONFIG.empleados.find(e => e.id === state.usuarioActualId);

            const solicitudesPendientes = state.solicitudes.filter(s => s.estado === 'pendiente').length;

            app.innerHTML = `
                <!-- Header / Barra Superior -->
                <header class="bg-indigo-600 text-white px-4 py-3 flex items-center justify-between shadow-md z-20 sticky top-0">
                    <div class="flex items-center space-x-2.5">
                        <div class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs px-2.5 py-1.5 rounded-xl shadow-inner border border-blue-400 flex items-center justify-center tracking-tighter select-none">
                            24h
                        </div>
                        <div>
                            <h1 class="font-bold text-base md:text-lg leading-tight">Turnos 24h</h1>
                            <p class="text-[11px] text-indigo-200">Guardia 8:00h a 8:00h (6 personas)</p>
                        </div>
                    </div>

                    <!-- Acciones Header -->
                    <div class="flex items-center space-x-2">
                        <button onclick="scrollAHistorial()" class="relative p-2 rounded-xl bg-indigo-700/50 hover:bg-indigo-700 text-indigo-100 transition" title="Ver Notificaciones">
                            <i data-lucide="bell" class="w-5 h-5"></i>
                            ${solicitudesPendientes > 0 ? `
                                <span class="absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] font-extrabold w-5 h-5 rounded-full flex items-center justify-center border-2 border-indigo-600 animate-pulse">
                                    ${solicitudesPendientes}
                                </span>
                            ` : ''}
                        </button>

                        <div class="flex items-center bg-indigo-700/60 p-1 rounded-xl text-xs">
                            <select id="selectUsuario" onchange="cambiarUsuario(this.value)" class="bg-transparent text-white font-medium pr-2 focus:outline-none cursor-pointer">
                                ${CONFIG.empleados.map(e => `
                                    <option value="${e.id}" class="text-slate-800" ${e.id === state.usuarioActualId && !state.esAdmin ? 'selected' : ''}>${e.nombre}</option>
                                `).join('')}
                                <option value="admin" class="text-slate-800 font-bold" ${state.esAdmin ? 'selected' : ''}>⚙️ Administrador</option>
                            </select>
                        </div>
                    </div>
                </header>

                <!-- Resumen Estado Usuario / Panel Superior -->
                ${crearResumenSuperior(empActual)}

                <!-- Calendario Principal -->
                <main class="flex-grow p-3 md:p-6 space-y-6">
                    ${crearCalendario()}
                    ${crearSeccionHistorial()}
                </main>
            `;

            lucide.createIcons();
        }

        function crearResumenSuperior(empActual) {
            if (state.esAdmin) {
                return `
                    <div class="bg-amber-50 border-b border-amber-200 px-4 py-2.5 text-xs text-amber-800 flex items-center justify-between">
                        <span class="flex items-center space-x-1.5 font-medium">
                            <i data-lucide="shield-alert" class="w-4 h-4 text-amber-600"></i>
                            <span>Modo Administrador: Haz clic en cualquier día para forzar ajustes de turno.</span>
                        </span>
                    </div>
                `;
            }

            const hoy = new Date();
            let proximaGuardia = null;
            for (let i = 0; i < 60; i++) {
                const d = new Date(hoy);
                d.setDate(d.getDate() + i);
                const fechaStr = d.toISOString().split('T')[0];
                const emp = obtenerEmpleadoFecha(fechaStr);
                if (emp.id === state.usuarioActualId) {
                    proximaGuardia = { fechaStr, dias: i };
                    break;
                }
            }

            return `
                <div class="bg-gradient-to-r from-indigo-50 to-blue-50 border-b border-indigo-100 px-4 py-3 flex items-center justify-between text-xs md:text-sm">
                    <div class="flex items-center space-x-3">
                        <div class="${empActual.color} text-white font-bold w-9 h-9 rounded-xl flex items-center justify-center shadow-sm">
                            ${empActual.iniciales}
                        </div>
                        <div>
                            <p class="text-slate-500 text-xs">Hola, <span class="font-bold text-slate-800">${empActual.nombre}</span></p>
                            <p class="font-semibold text-slate-700">
                                ${proximaGuardia ? `Próxima guardia: <span class="text-indigo-600 font-bold">${proximaGuardia.dias === 0 ? '¡Hoy!' : (proximaGuardia.dias === 1 ? 'Mañana' : 'En ' + proximaGuardia.dias + ' días')}</span> (${formatearFechaLarga(proximaGuardia.fechaStr)})` : 'Sin guardias próximas'}
                            </p>
                        </div>
                    </div>
                    <button onclick="abrirModalSolicitudCambio()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-2 rounded-xl text-xs flex items-center space-x-1.5 shadow-sm transition">
                        <i data-lucide="repeat" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Solicitar</span> Permuta
                    </button>
                </div>
            `;
        }

        function crearCalendario() {
            const mesesNombres = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            const primerDiaMes = new Date(state.añoActual, state.mesActual, 1);
            const ultimoDiaMes = new Date(state.añoActual, state.mesActual + 1, 0);
            
            let diaSemanaInicio = primerDiaMes.getDay() - 1;
            if (diaSemanaInicio === -1) diaSemanaInicio = 6;

            const totalDias = ultimoDiaMes.getDate();
            const hoyStr = new Date().toISOString().split('T')[0];

            let celdas = [];
            for (let i = 0; i < diaSemanaInicio; i++) {
                celdas.push(`<div class="bg-slate-50/50 border border-slate-100 rounded-xl min-h-[75px] md:min-h-[90px]"></div>`);
            }

            for (let dia = 1; dia <= totalDias; dia++) {
                const mesFormateado = String(state.mesActual + 1).padStart(2, '0');
                const diaFormateado = String(dia).padStart(2, '0');
                const fechaStr = `${state.añoActual}-${mesFormateado}-${diaFormateado}`;
                
                const empAsignado = obtenerEmpleadoFecha(fechaStr);
                const esHoy = fechaStr === hoyStr;
                const esMiGuardia = empAsignado.id === state.usuarioActualId && !state.esAdmin;
                const tieneExcepcion = !!state.excepciones[fechaStr];

                celdas.push(`
                    <div onclick="${state.esAdmin ? `abrirModalEditarExcepcion('${fechaStr}')` : ''}" 
                         class="border ${esHoy ? 'border-indigo-500 ring-2 ring-indigo-200 bg-indigo-50/30' : 'border-slate-200 bg-white'} ${esMiGuardia ? 'ring-2 ring-blue-400' : ''} rounded-xl p-1.5 md:p-2.5 flex flex-col justify-between min-h-[75px] md:min-h-[95px] transition hover:shadow-md relative group ${state.esAdmin ? 'cursor-pointer' : ''}">
                        
                        <div class="flex items-center justify-between">
                            <span class="text-xs md:text-sm font-bold ${esHoy ? 'bg-indigo-600 text-white w-5 h-5 md:w-6 md:h-6 rounded-full flex items-center justify-center' : 'text-slate-700'}">
                                ${dia}
                            </span>
                            ${tieneExcepcion ? `<span class="text-[9px] bg-amber-100 text-amber-700 px-1 rounded font-semibold" title="Ajustado">Mod.</span>` : ''}
                        </div>

                        <div class="mt-1">
                            <div class="${empAsignado.color} text-white text-[10px] md:text-xs font-semibold px-1.5 py-1 rounded-lg flex items-center justify-between shadow-xs truncate">
                                <span class="truncate">${empAsignado.nombre.split(' ')[0]}</span>
                                <span class="text-[9px] opacity-80 uppercase ml-0.5">${empAsignado.iniciales}</span>
                            </div>
                        </div>
                    </div>
                `);
            }

            return `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="flex items-center justify-between px-4 py-3 bg-slate-50 border-b border-slate-200">
                        <button onclick="cambiarMesCalendario(-1)" class="p-2 rounded-xl hover:bg-slate-200 text-slate-600 transition">
                            <i data-lucide="chevron-left" class="w-5 h-5"></i>
                        </button>
                        <h2 class="font-bold text-slate-800 text-base md:text-lg">
                            ${mesesNombres[state.mesActual]} ${state.añoActual}
                        </h2>
                        <button onclick="cambiarMesCalendario(1)" class="p-2 rounded-xl hover:bg-slate-200 text-slate-600 transition">
                            <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="p-2 md:p-4">
                        <div class="grid grid-cols-7 gap-1 md:gap-2 mb-2 text-center">
                            ${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `
                                <div class="text-[11px] md:text-xs font-bold text-slate-400 uppercase tracking-wider py-1">${d}</div>
                            `).join('')}
                        </div>
                        <div class="grid grid-cols-7 gap-1 md:gap-2">
                            ${celdas.join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function crearSeccionHistorial() {
            return `
                <section id="seccionHistorial" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 md:p-6 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <div class="flex items-center space-x-2">
                            <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i>
                            <h3 class="font-bold text-slate-900 text-base">Historial y Permutas</h3>
                        </div>
                        <span class="text-xs bg-slate-100 text-slate-600 font-medium px-2.5 py-1 rounded-full">
                            ${state.solicitudes.length} registros
                        </span>
                    </div>

                    ${state.solicitudes.length === 0 ? `
                        <div class="text-center py-8 text-slate-400 text-xs">
                            <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
                            No hay registros ni solicitudes de permuta actualmente.
                        </div>
                    ` : `
                        <div class="space-y-3">
                            ${state.solicitudes.map(sol => {
                                const empSolicitante = CONFIG.empleados.find(e => e.id === sol.solicitanteId);
                                const empDestino = CONFIG.empleados.find(e => e.id === sol.destinoId);

                                return `
                                    <div class="border border-slate-200 rounded-xl p-3.5 bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-3 text-xs">
                                        <div class="space-y-1">
                                            <div class="flex items-center space-x-2">
                                                <span class="font-bold text-slate-800">${empSolicitante ? empSolicitante.nombre : 'Usuario'}</span>
                                                <i data-lucide="arrow-right-left" class="w-3.5 h-3.5 text-slate-400"></i>
                                                <span class="font-bold text-slate-800">${empDestino ? empDestino.nombre : 'Usuario'}</span>
                                                
                                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                                    sol.estado === 'pendiente' ? 'bg-amber-100 text-amber-800' :
                                                    sol.estado === 'aprobada' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                                                }">
                                                    ${sol.estado.toUpperCase()}
                                                </span>
                                            </div>
                                            <p class="text-slate-500">
                                                Permuta: <span class="font-semibold text-slate-700">${formatearFechaCorta(sol.fechaSolicitante)}</span> 
                                                por <span class="font-semibold text-slate-700">${formatearFechaCorta(sol.fechaDestino)}</span>
                                            </p>
                                            ${sol.motivo ? `<p class="text-slate-400 italic text-[11px]">"${sol.motivo}"</p>` : ''}
                                        </div>

                                        ${sol.estado === 'pendiente' ? `
                                            <div class="flex items-center space-x-2 self-end md:self-center">
                                                ${state.esAdmin || sol.destinoId === state.usuarioActualId ? `
                                                    <button onclick="gestionarSolicitud('${sol.id}', 'aprobada')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-lg text-xs shadow-xs transition">Aceptar</button>
                                                    <button onclick="gestionarSolicitud('${sol.id}', 'rechazada')" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-lg text-xs shadow-xs transition">Rechazar</button>
                                                ` : ''}
                                                ${sol.solicitanteId === state.usuarioActualId ? `
                                                    <button onclick="cancelarSolicitud('${sol.id}')" class="px-3 py-1.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg text-xs transition">Cancelar</button>
                                                ` : ''}
                                            </div>
                                        ` : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </section>
            `;
        }

        // --- 4. VALIDACIONES EN TIEMPO REAL ---
        function validarPermutaEnTiempoReal() {
            const inputFechaA = document.getElementById('fechaSolicitante').value;
            const selectDestino = document.getElementById('empleadoDestino');
            const empDestinoId = selectDestino ? parseInt(selectDestino.value) : null;
            const inputFechaB = document.getElementById('fechaDestino').value;

            const boxError = document.getElementById('errorValidacionPermuta');
            const textoError = document.getElementById('textoErrorValidacion');
            const btnEnviar = document.getElementById('btnEnviarSolicitud');

            if (!boxError || !btnEnviar || !textoError) return;

            boxError.classList.add('hidden');
            btnEnviar.disabled = false;

            if (inputFechaA) {
                const empFechaA = obtenerEmpleadoFecha(inputFechaA);
                if (empFechaA.id !== state.usuarioActualId) {
                    boxError.classList.remove('hidden');
                    textoError.innerText = `El ${formatearFechaCorta(inputFechaA)} NO tienes guardia asignada (le corresponde a ${empFechaA.nombre}).`;
                    btnEnviar.disabled = true;
                    return;
                }
            }

            if (inputFechaB && empDestinoId) {
                const empFechaB = obtenerEmpleadoFecha(inputFechaB);
                if (empFechaB.id !== empDestinoId) {
                    const empDestinoObj = CONFIG.empleados.find(e => e.id === empDestinoId);
                    const nombreCompañero = empDestinoObj ? empDestinoObj.nombre : 'tu compañero';
                    boxError.classList.remove('hidden');
                    textoError.innerText = `El ${formatearFechaCorta(inputFechaB)} NO es el día de guardia de ${nombreCompañero} (ese día le toca a ${empFechaB.nombre}).`;
                    btnEnviar.disabled = true;
                    return;
                }
            }
        }

        // --- 5. GESTIÓN DE ACCIONES Y EVENTOS ---
        function cambiarUsuario(val) {
            if (val === 'admin') {
                state.esAdmin = true;
            } else {
                state.esAdmin = false;
                state.usuarioActualId = parseInt(val);
            }
            renderizarApp();
        }

        function cambiarMesCalendario(delta) {
            state.mesActual += delta;
            if (state.mesActual > 11) {
                state.mesActual = 0;
                state.añoActual++;
            } else if (state.mesActual < 0) {
                state.mesActual = 11;
                state.añoActual--;
            }
            renderizarApp();
        }

        function scrollAHistorial() {
            const el = document.getElementById('seccionHistorial');
            if (el) {
                el.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function cerrarModal(idModal) {
            const modal = document.getElementById(idModal);
            if (modal) modal.classList.add('hidden');
        }

        function abrirModalSolicitudCambio() {
            const select = document.getElementById('empleadoDestino');
            select.innerHTML = CONFIG.empleados
                .filter(e => e.id !== state.usuarioActualId)
                .map(e => `<option value="${e.id}">${e.nombre}</option>`)
                .join('');

            document.getElementById('fechaSolicitante').value = '';
            document.getElementById('fechaDestino').value = '';
            document.getElementById('motivoSolicitud').value = '';
            
            const boxError = document.getElementById('errorValidacionPermuta');
            if (boxError) boxError.classList.add('hidden');
            
            const btnEnviar = document.getElementById('btnEnviarSolicitud');
            if (btnEnviar) btnEnviar.disabled = false;

            document.getElementById('modalSolicitud').classList.remove('hidden');
            setTimeout(validarPermutaEnTiempoReal, 50);
        }

        function abrirModalEditarExcepcion(fechaStr) {
            const empActualFecha = obtenerEmpleadoFecha(fechaStr);
            document.getElementById('fechaExcepcion').value = fechaStr;
            document.getElementById('subtituloExcepcion').innerText = `Fecha: ${formatearFechaCorta(fechaStr)}`;
            
            const select = document.getElementById('selectEmpleadoExcepcion');
            select.innerHTML = CONFIG.empleados.map(e => `
                <option value="${e.id}" ${e.id === empActualFecha.id ? 'selected' : ''}>${e.nombre}</option>
            `).join('');

            const excExistente = state.excepciones[fechaStr];
            document.getElementById('notaExcepcion').value = excExistente ? (excExistente.motivo || '') : '';

            document.getElementById('modalExcepcion').classList.remove('hidden');
        }

        function procesarSolicitudCambio(e) {
            e.preventDefault();
            const fechaA = document.getElementById('fechaSolicitante').value;
            const destinoId = parseInt(document.getElementById('empleadoDestino').value);
            const fechaB = document.getElementById('fechaDestino').value;
            const motivo = document.getElementById('motivoSolicitud').value;

            const solId = 'sol_' + Date.now();
            const nuevaSolicitud = {
                solicitanteId: state.usuarioActualId,
                destinoId,
                fechaSolicitante: fechaA,
                fechaDestino: fechaB,
                motivo,
                estado: 'pendiente',
                timestamp: new Date().toISOString()
            };

            if (window.cloudDB && window.cloudAppId) {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                    const docRef = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'solicitudes', solId);
                    setDoc(docRef, nuevaSolicitud);
                });
            } else {
                state.solicitudes.unshift({ id: solId, ...nuevaSolicitud });
                guardarEstado();
                renderizarApp();
            }

            cerrarModal('modalSolicitud');
        }

        function gestionarSolicitud(solId, nuevoEstado) {
            const sol = state.solicitudes.find(s => s.id === solId);
            if (!sol) return;

            if (window.cloudDB && window.cloudAppId) {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, updateDoc, setDoc }) => {
                    const solRef = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'solicitudes', solId);
                    updateDoc(solRef, { estado: nuevoEstado });

                    if (nuevoEstado === 'aprobada') {
                        const exc1Ref = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'excepciones', sol.fechaSolicitante);
                        const exc2Ref = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'excepciones', sol.fechaDestino);
                        setDoc(exc1Ref, { empleadoId: sol.destinoId, motivo: 'Permuta aprobada' });
                        setDoc(exc2Ref, { empleadoId: sol.solicitanteId, motivo: 'Permuta aprobada' });
                    }
                });
            } else {
                sol.estado = nuevoEstado;
                if (nuevoEstado === 'aprobada') {
                    state.excepciones[sol.fechaSolicitante] = { empleadoId: sol.destinoId, motivo: 'Permuta aprobada' };
                    state.excepciones[sol.fechaDestino] = { empleadoId: sol.solicitanteId, motivo: 'Permuta aprobada' };
                }
                guardarEstado();
                renderizarApp();
            }
        }

        function cancelarSolicitud(solId) {
            if (window.cloudDB && window.cloudAppId) {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, deleteDoc }) => {
                    const solRef = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'solicitudes', solId);
                    deleteDoc(solRef);
                });
            } else {
                state.solicitudes = state.solicitudes.filter(s => s.id !== solId);
                guardarEstado();
                renderizarApp();
            }
        }

        function guardarExcepcion(e) {
            e.preventDefault();
            const fechaStr = document.getElementById('fechaExcepcion').value;
            const empId = parseInt(document.getElementById('selectEmpleadoExcepcion').value);
            const motivo = document.getElementById('notaExcepcion').value;

            if (window.cloudDB && window.cloudAppId) {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, setDoc }) => {
                    const excRef = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'excepciones', fechaStr);
                    setDoc(excRef, { empleadoId: empId, motivo });
                });
            } else {
                state.excepciones[fechaStr] = { empleadoId: empId, motivo };
                guardarEstado();
                renderizarApp();
            }
            cerrarModal('modalExcepcion');
        }

        function eliminarExcepcion() {
            const fechaStr = document.getElementById('fechaExcepcion').value;
            if (window.cloudDB && window.cloudAppId) {
                import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then(({ doc, deleteDoc }) => {
                    const excRef = doc(window.cloudDB, 'artifacts', window.cloudAppId, 'public', 'data', 'excepciones', fechaStr);
                    deleteDoc(excRef);
                });
            } else {
                delete state.excepciones[fechaStr];
                guardarEstado();
                renderizarApp();
            }
            cerrarModal('modalExcepcion');
        }

        // Inicializar renderizado al cargar
        window.addEventListener('DOMContentLoaded', renderizarApp);
    </script>
</body>
</html>
