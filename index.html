<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Turnos 24h</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsPDF & AutoTable CDN para exportación a PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <!-- Manifest & Dynamic Favicon for PWA -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='45' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>24h</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='65' font-size='45' font-weight='bold' text-anchor='middle' fill='white' font-family='sans-serif'>24h</text></svg>">
    <meta name="theme-color" content="#2563eb">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header / Navbar Principal -->
    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-blue-600 p-2 rounded-xl font-black text-xl shadow">24h</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Guardias de 24h</h1>
                    <p class="text-xs text-blue-100">Rotación continua de 6 días</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Selector de Perfil -->
                <select id="userSelector" class="bg-blue-700 text-white text-xs font-semibold px-2 py-1.5 rounded-lg border border-blue-500 focus:outline-none focus:ring-2 focus:ring-white">
                    <option value="1">Ana Gómez (AG)</option>
                    <option value="2">Carlos Ruiz (CR)</option>
                    <option value="3">David López (DL)</option>
                    <option value="4">Elena Sanz (ES)</option>
                    <option value="5">Fernando Gil (FG)</option>
                    <option value="6">Gloria Marín (GM)</option>
                    <option value="admin">⚙️ Administrador</option>
                </select>

                <!-- Botón Campana Notificaciones -->
                <button onclick="scrollAHistorial()" class="relative p-2 rounded-xl bg-blue-700 hover:bg-blue-800 transition">
                    <i data-lucide="bell" class="w-5 h-5"></i>
                    <span id="badgeNotificaciones" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full animate-pulse">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 mt-4 space-y-6">

        <!-- Controles de Mes y Exportación -->
        <div class="bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-3">
            <div class="flex items-center space-x-2">
                <button onclick="cambiarMes(-1)" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 transition">
                    <i data-lucide="chevron-left" class="w-5 h-5"></i>
                </button>
                <h2 id="mesAnioTexto" class="text-base sm:text-lg font-bold min-w-[140px] text-center capitalize">Cargando...</h2>
                <button onclick="cambiarMes(1)" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 transition">
                    <i data-lucide="chevron-right" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                <button onclick="exportarMesAExcel()" class="flex-1 sm:flex-initial px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 shadow-sm transition">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                    <span>Excel</span>
                </button>
                <button onclick="abrirModalSolicitudCambio()" class="flex-1 sm:flex-initial px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center justify-center space-x-1 shadow-sm transition">
                    <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
                    <span>Permuta</span>
                </button>
            </div>
        </div>

        <!-- Calendario Cuadrante (Vista en Rejilla Responsiva) -->
        <div class="bg-white p-3 sm:p-4 rounded-2xl shadow-sm border border-slate-200">
            <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-slate-400 mb-2">
                <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
            </div>
            <div id="gridCalendario" class="grid grid-cols-7 gap-1 sm:gap-2">
                <!-- Se rellena dinámicamente -->
            </div>
        </div>

        <!-- Panel de Horas y Guardias Trabajadas -->
        <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 text-sm sm:text-base flex items-center space-x-2 mb-3">
                <i data-lucide="clock" class="w-5 h-5 text-blue-600"></i>
                <span>Estadísticas de Guardias y Horas Trabajadas</span>
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-xs text-left">
                    <thead class="bg-slate-50 text-slate-500 uppercase font-semibold">
                        <tr>
                            <th class="p-2 rounded-l-lg">Compañero</th>
                            <th class="p-2 text-center">Guardias (24h)</th>
                            <th class="p-2 text-right rounded-r-lg">Horas Totales</th>
                        </tr>
                    </thead>
                    <tbody id="tablaStats" class="divide-y divide-slate-100 font-medium">
                        <!-- Relleno dinámico -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Historial y Solicitudes de Permuta -->
        <section id="seccionHistorial" class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="font-bold text-slate-800 text-sm sm:text-base flex items-center space-x-2 mb-3">
                <i data-lucide="history" class="w-5 h-5 text-blue-600"></i>
                <span>Historial de Permutas y Solicitudes</span>
            </h3>
            <div id="listaSolicitudes" class="space-y-3 text-xs">
                <!-- Relleno dinámico -->
            </div>
        </section>

    </main>

    <!-- Modal Solicitud de Permuta -->
    <div id="modalSolicitud" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-base">Solicitar Cambio / Permuta</h3>
                <button onclick="cerrarModal('modalSolicitud')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="formSolicitud" onsubmit="procesarSolicitudCambio(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Mi día de guardia a cambiar:</label>
                    <input type="date" id="fechaSolicitante" onchange="validarPermutaEnTiempoReal()" oninput="validarPermutaEnTiempoReal()" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Compañero con quien permuto:</label>
                    <select id="empleadoDestino" onchange="validarPermutaEnTiempoReal()" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" required></select>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Día de guardia del compañero:</label>
                    <input type="date" id="fechaDestino" onchange="validarPermutaEnTiempoReal()" oninput="validarPermutaEnTiempoReal()" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
                </div>

                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Motivo (Opcional):</label>
                    <input type="text" id="motivoSolicitud" placeholder="Ej. Asunto personal" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div id="mensajeErrorValidacion" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 font-medium"></div>

                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="cerrarModal('modalSolicitud')" class="w-1/2 py-2.5 rounded-lg bg-slate-100 hover:bg-slate-200 font-semibold text-slate-700">Cancelar</button>
                    <button type="submit" id="btnEnviarSolicitud" class="w-1/2 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 font-semibold text-white shadow-sm disabled:opacity-50">Enviar Solicitud</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ajuste de Excepción (Admin) -->
    <div id="modalExcepcion" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-base">Ajustar Día Manualmente</h3>
                <button onclick="cerrarModal('modalExcepcion')" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form onsubmit="guardarExcepcion(event)" class="space-y-3 text-xs">
                <input type="hidden" id="fechaExcepcion">
                <p id="subtituloExcepcion" class="text-slate-500 font-medium"></p>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Asignar Guardia A:</label>
                    <select id="selectEmpleadoExcepcion" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"></select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Observación / Motivo:</label>
                    <input type="text" id="notaExcepcion" class="w-full p-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="eliminarExcepcion()" class="py-2.5 px-3 rounded-lg bg-red-100 hover:bg-red-200 font-semibold text-red-700">Restablecer</button>
                    <button type="submit" class="flex-1 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 font-semibold text-white shadow-sm">Guardar Ajuste</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lógica de Javascript -->
    <script>
        // Configuración Inicial del Equipo (6 Integrantes)
        const CONFIG = {
            fechaReferencia: "2026-01-01", // Fecha base de ciclo
            empleados: [
                { id: 1, nombre: "Ana Gómez", iniciales: "AG", color: "bg-blue-100 text-blue-800 border-blue-300" },
                { id: 2, nombre: "Carlos Ruiz", iniciales: "CR", color: "bg-emerald-100 text-emerald-800 border-emerald-300" },
                { id: 3, nombre: "David López", iniciales: "DL", color: "bg-purple-100 text-purple-800 border-purple-300" },
                { id: 4, nombre: "Elena Sanz", iniciales: "ES", color: "bg-amber-100 text-amber-800 border-amber-300" },
                { id: 5, nombre: "Fernando Gil", iniciales: "FG", color: "bg-rose-100 text-rose-800 border-rose-300" },
                { id: 6, nombre: "Gloria Marín", iniciales: "GM", color: "bg-indigo-100 text-indigo-800 border-indigo-300" }
            ]
        };

        // Estado de la Aplicación
        let state = {
            fechaActual: new Date(),
            usuarioActualId: 1, // Default: Ana Gómez
            excepciones: {},
            solicitudes: []
        };

        // Cargar Datos de LocalStorage
        function cargarEstado() {
            try {
                const exc = localStorage.getItem('guardias_excepciones');
                const sol = localStorage.getItem('guardias_solicitudes');
                if (exc) state.excepciones = JSON.parse(exc);
                if (sol) state.solicitudes = JSON.parse(sol);
            } catch (e) {
                console.error("Error al cargar estado local", e);
            }
        }

        // Guardar Datos en LocalStorage
        function guardarEstado() {
            try {
                localStorage.setItem('guardias_excepciones', JSON.stringify(state.excepciones));
                localStorage.setItem('guardias_solicitudes', JSON.stringify(state.solicitudes));
            } catch (e) {
                console.error("Error al guardar estado local", e);
            }
        }

        // Utilidades de Fechas
        function parseFechaLocal(fechaStr) {
            const [y, m, d] = fechaStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function formatearFecha(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function formatearFechaCorta(fechaStr) {
            const d = parseFechaLocal(fechaStr);
            return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
        }

        function formatearFechaLarga(fechaStr) {
            const d = parseFechaLocal(fechaStr);
            return d.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
        }

        // Cálculo Matemático de Guardia Rotativa
        function obtenerEmpleadoFecha(fechaStr) {
            if (state.excepciones[fechaStr]) {
                const empId = state.excepciones[fechaStr].empleadoId;
                return CONFIG.empleados.find(e => e.id === empId);
            }

            const fBase = parseFechaLocal(CONFIG.fechaReferencia);
            const fTarget = parseFechaLocal(fechaStr);
            const diffDias = Math.floor((fTarget - fBase) / (1000 * 60 * 60 * 24));
            
            let index = diffDias % CONFIG.empleados.length;
            if (index < 0) index += CONFIG.empleados.length;
            
            return CONFIG.empleados[index];
        }

        // Renderizado de la Interfaz
        function renderizarApp() {
            lucide.createIcons();
            renderizarCabeceraMes();
            renderizarCalendario();
            renderizarStats();
            renderizarHistorial();
            actualizarBadgeNotificaciones();
        }

        function renderizarCabeceraMes() {
            const texto = state.fechaActual.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            document.getElementById('mesAnioTexto').innerText = texto;
        }

        function cambiarMes(delta) {
            state.fechaActual.setMonth(state.fechaActual.getMonth() + delta);
            renderizarApp();
        }

        function renderizarCalendario() {
            const grid = document.getElementById('gridCalendario');
            grid.innerHTML = '';

            const anio = state.fechaActual.getFullYear();
            const mes = state.fechaActual.getMonth();

            const primerDiaMes = new Date(anio, mes, 1);
            const ultimoDiaMes = new Date(anio, mes + 1, 0);
            
            // Ajuste para lunes (0 = Lunes, 6 = Domingo)
            let diaSemanaInicio = primerDiaMes.getDay() - 1;
            if (diaSemanaInicio === -1) diaSemanaInicio = 6;

            // Días vacíos previos
            for (let i = 0; i < diaSemanaInicio; i++) {
                grid.innerHTML += `<div class="h-16 sm:h-20 bg-slate-50/50 rounded-xl"></div>`;
            }

            // Días del mes
            const hoyStr = formatearFecha(new Date());

            for (let dia = 1; dia <= ultimoDiaMes.getDate(); dia++) {
                const fechaObj = new Date(anio, mes, dia);
                const fechaStr = formatearFecha(fechaObj);
                const emp = obtenerEmpleadoFecha(fechaStr);
                const esHoy = hoyStr === fechaStr;
                const tieneExcepcion = !!state.excepciones[fechaStr];

                const esAdmin = state.usuarioActualId === 'admin';
                const esUsuarioSeleccionado = emp.id === state.usuarioActualId;

                grid.innerHTML += `
                    <div onclick="${esAdmin ? `abrirModalEditarExcepcion('${fechaStr}')` : ''}" 
                         class="h-16 sm:h-20 p-1 rounded-xl border flex flex-col justify-between transition relative ${esHoy ? 'ring-2 ring-blue-600' : ''} ${esUsuarioSeleccionado ? 'ring-2 ring-blue-500 font-bold scale-[1.02] shadow-sm' : ''} ${emp.color} ${esAdmin ? 'cursor-pointer hover:opacity-80' : ''}">
                        <div class="flex justify-between items-center text-[10px] sm:text-xs font-bold">
                            <span>${dia}</span>
                            ${tieneExcepcion ? '<span class="text-amber-600 font-extrabold">*</span>' : ''}
                        </div>
                        <div class="text-center my-auto">
                            <span class="font-black text-xs sm:text-sm block">${emp.iniciales}</span>
                        </div>
                    </div>
                `;
            }
        }

        function calcularGuardiasMes(anio, mes) {
            const stats = {};
            CONFIG.empleados.forEach(emp => stats[emp.id] = 0);

            const totalDias = new Date(anio, mes + 1, 0).getDate();
            for (let dia = 1; dia <= totalDias; dia++) {
                const fechaStr = formatearFecha(new Date(anio, mes, dia));
                const emp = obtenerEmpleadoFecha(fechaStr);
                if (stats[emp.id] !== undefined) {
                    stats[emp.id]++;
                }
            }
            return stats;
        }

        function renderizarStats() {
            const tbody = document.getElementById('tablaStats');
            if (!tbody) return;

            const anio = state.fechaActual.getFullYear();
            const mes = state.fechaActual.getMonth();
            const stats = calcularGuardiasMes(anio, mes);

            tbody.innerHTML = CONFIG.empleados.map(emp => {
                const guardias = stats[emp.id] || 0;
                const horas = guardias * 24;
                const esSeleccionado = emp.id === state.usuarioActualId;
                return `
                    <tr class="${esSeleccionado ? 'bg-blue-50/80 font-bold text-blue-900' : 'hover:bg-slate-50'}">
                        <td class="p-2 flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full ${emp.color.split(' ')[0]}"></span>
                            <span>${emp.nombre} (${emp.iniciales})</span>
                        </td>
                        <td class="p-2 text-center font-bold">${guardias}</td>
                        <td class="p-2 text-right font-bold text-blue-600">${horas} h</td>
                    </tr>
                `;
            }).join('');
        }

        function renderizarHistorial() {
            const contenedor = document.getElementById('listaSolicitudes');
            if (!contenedor) return;

            if (state.solicitudes.length === 0) {
                contenedor.innerHTML = '<p class="text-slate-400 text-center py-4">No hay solicitudes de permuta registradas.</p>';
                return;
            }

            contenedor.innerHTML = state.solicitudes.slice().reverse().map(sol => {
                const empOrigen = CONFIG.empleados.find(e => e.id === sol.origenId);
                const empDestino = CONFIG.empleados.find(e => e.id === sol.destinoId);
                const esAdmin = state.usuarioActualId === 'admin';
                const esDestino = sol.destinoId === state.usuarioActualId;
                const pendiente = sol.estado === 'pendiente';

                let badgeEstado = '';
                if (sol.estado === 'pendiente') badgeEstado = '<span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-semibold">Pendiente</span>';
                else if (sol.estado === 'aprobado') badgeEstado = '<span class="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded font-semibold">Aprobado</span>';
                else badgeEstado = '<span class="bg-rose-100 text-rose-800 px-2 py-0.5 rounded font-semibold">Rechazado</span>';

                return `
                    <div class="p-3 rounded-xl border border-slate-200 bg-slate-50 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-700">${empOrigen?.nombre} ⇄ ${empDestino?.nombre}</span>
                            ${badgeEstado}
                        </div>
                        <div class="text-slate-600 space-y-0.5">
                            <p><b>Cambio:</b> ${formatearFechaLarga(sol.fechaOrigen)} por ${formatearFechaLarga(sol.fechaDestino)}</p>
                            ${sol.motivo ? `<p class="italic text-slate-500">"${sol.motivo}"</p>` : ''}
                        </div>
                        ${pendiente && (esDestino || esAdmin) ? `
                            <div class="flex space-x-2 pt-1">
                                <button onclick="responderSolicitud('${sol.id}', false)" class="flex-1 py-1 rounded bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold">Rechazar</button>
                                <button onclick="responderSolicitud('${sol.id}', true)" class="flex-1 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-white font-bold">Aprobar</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function actualizarBadgeNotificaciones() {
            const badge = document.getElementById('badgeNotificaciones');
            if (!badge) return;

            const pendientes = state.solicitudes.filter(s => 
                s.estado === 'pendiente' && (s.destinoId === state.usuarioActualId || state.usuarioActualId === 'admin')
            ).length;

            if (pendientes > 0) {
                badge.innerText = pendientes;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function scrollAHistorial() {
            document.getElementById('seccionHistorial')?.scrollIntoView({ behavior: 'smooth' });
        }

        function abrirModalSolicitudCambio() {
            const select = document.getElementById('empleadoDestino');
            if (select) {
                select.innerHTML = CONFIG.empleados
                    .filter(e => e.id !== state.usuarioActualId)
                    .map(e => `<option value="${e.id}">${e.nombre} (${e.iniciales})</option>`)
                    .join('');
            }

            // Resetear inputs de fecha
            document.getElementById('fechaSolicitante').value = '';
            document.getElementById('fechaDestino').value = '';
            document.getElementById('motivoSolicitud').value = '';

            document.getElementById('mensajeErrorValidacion')?.classList.add('hidden');
            document.getElementById('modalSolicitud')?.classList.remove('hidden');
        }

        function cerrarModal(idModal) {
            const modal = document.getElementById(idModal);
            if (modal) modal.classList.add('hidden');
        }

        function validarPermutaEnTiempoReal() {
            const fOrigen = document.getElementById('fechaSolicitante').value;
            const destId = parseInt(document.getElementById('empleadoDestino').value);
            const fDestino = document.getElementById('fechaDestino').value;
            const msgBox = document.getElementById('mensajeErrorValidacion');
            const btnSubmit = document.getElementById('btnEnviarSolicitud');

            if (!fOrigen && !fDestino) {
                if (msgBox) msgBox.classList.add('hidden');
                if (btnSubmit) btnSubmit.disabled = false;
                return true;
            }

            let error = null;

            // Validar de forma estricta si la fecha elegida como propia realmente es guardia del usuario actual
            if (fOrigen && state.usuarioActualId !== 'admin') {
                const empOrigenReal = obtenerEmpleadoFecha(fOrigen);
                if (empOrigenReal.id !== state.usuarioActualId) {
                    const miUsuario = CONFIG.empleados.find(e => e.id === state.usuarioActualId);
                    error = `El ${formatearFechaCorta(fOrigen)} no tienes guardia (${miUsuario?.iniciales}). Ese día le corresponde a ${empOrigenReal.nombre} (${empOrigenReal.iniciales}).`;
                }
            }

            // Validar si la fecha del compañero le pertenece realmente al compañero seleccionado
            if (!error && fDestino && destId) {
                const empDestinoReal = obtenerEmpleadoFecha(fDestino);
                const empSeleccionado = CONFIG.empleados.find(e => e.id === destId);
                if (empDestinoReal.id !== destId) {
                    error = `El ${formatearFechaCorta(fDestino)} no tiene guardia ${empSeleccionado?.nombre} (${empSeleccionado?.iniciales}). Le corresponde a ${empDestinoReal.nombre} (${empDestinoReal.iniciales}).`;
                }
            }

            if (error) {
                if (msgBox) {
                    msgBox.innerText = error;
                    msgBox.classList.remove('hidden');
                }
                if (btnSubmit) btnSubmit.disabled = true;
                return false;
            } else {
                if (msgBox) msgBox.classList.add('hidden');
                if (btnSubmit) btnSubmit.disabled = false;
                return true;
            }
        }

        function procesarSolicitudCambio(e) {
            e.preventDefault();
            if (!validarPermutaEnTiempoReal()) return;

            const nuevaSol = {
                id: Date.now().toString(),
                origenId: state.usuarioActualId === 'admin' ? 1 : state.usuarioActualId,
                fechaOrigen: document.getElementById('fechaSolicitante').value,
                destinoId: parseInt(document.getElementById('empleadoDestino').value),
                fechaDestino: document.getElementById('fechaDestino').value,
                motivo: document.getElementById('motivoSolicitud').value,
                estado: 'pendiente'
            };

            state.solicitudes.push(nuevaSol);
            guardarEstado();
            cerrarModal('modalSolicitud');
            renderizarApp();
        }

        function responderSolicitud(idSol, aprobar) {
            const sol = state.solicitudes.find(s => s.id === idSol);
            if (!sol) return;

            sol.estado = aprobar ? 'aprobado' : 'rechazado';

            if (aprobar) {
                state.excepciones[sol.fechaOrigen] = { empleadoId: sol.destinoId, motivo: 'Permuta aprobada' };
                state.excepciones[sol.fechaDestino] = { empleadoId: sol.origenId, motivo: 'Permuta aprobada' };
            }

            guardarEstado();
            renderizarApp();
        }

        function abrirModalEditarExcepcion(fechaStr) {
            const empActual = obtenerEmpleadoFecha(fechaStr);
            document.getElementById('fechaExcepcion').value = fechaStr;
            document.getElementById('subtituloExcepcion').innerText = `Ajuste para ${formatearFechaLarga(fechaStr)}`;
            
            const select = document.getElementById('selectEmpleadoExcepcion');
            if (select) {
                select.innerHTML = CONFIG.empleados.map(e => `
                    <option value="${e.id}" ${e.id === empActual.id ? 'selected' : ''}>${e.nombre} (${e.iniciales})</option>
                `).join('');
            }
            
            document.getElementById('notaExcepcion').value = state.excepciones[fechaStr]?.motivo || '';
            document.getElementById('modalExcepcion').classList.remove('hidden');
        }

        function guardarExcepcion(e) {
            e.preventDefault();
            const fechaStr = document.getElementById('fechaExcepcion').value;
            const empId = parseInt(document.getElementById('selectEmpleadoExcepcion').value);
            const nota = document.getElementById('notaExcepcion').value;

            state.excepciones[fechaStr] = { empleadoId: empId, motivo: nota || 'Ajuste Manual Admin' };
            guardarEstado();
            cerrarModal('modalExcepcion');
            renderizarApp();
        }

        function eliminarExcepcion() {
            const fechaStr = document.getElementById('fechaExcepcion').value;
            delete state.excepciones[fechaStr];
            guardarEstado();
            cerrarModal('modalExcepcion');
            renderizarApp();
        }

        function exportarMesAExcel() {
            const anio = state.fechaActual.getFullYear();
            const mesNumero = state.fechaActual.getMonth();
            const mesNombre = state.fechaActual.toLocaleDateString('es-ES', { month: 'long' });

            let csvContent = `data:text/csv;charset=utf-8,\uFEFF`;
            csvContent += `INFORME MENSUAL DE GUARDIAS DE 24H - ${mesNombre.toUpperCase()} ${anio}\n\n`;

            csvContent += `CUADRANTE DIARIO\n`;
            csvContent += `Fecha,Dia de la semana,Guardia Asignada,Observaciones\n`;

            const diasEnMes = new Date(anio, mesNumero + 1, 0).getDate();
            for (let dia = 1; dia <= diasEnMes; dia++) {
                const fecha = new Date(anio, mesNumero, dia);
                const fechaStr = formatearFecha(fecha);
                const emp = obtenerEmpleadoFecha(fechaStr);
                const diaSemana = fecha.toLocaleDateString('es-ES', { weekday: 'long' });
                const exc = state.excepciones[fechaStr];
                const obs = exc ? (exc.motivo || 'Ajuste / Permuta') : 'Turno Normal';

                csvContent += `"${fechaStr}","${diaSemana}","${emp.nombre} (${emp.iniciales})","${obs}"\n`;
            }

            csvContent += `\nRESUMEN DE GUARDIAS Y HORAS TRABAJADAS\n`;
            csvContent += `Companero,Total Guardias (24h),Total Horas Trabajadas\n`;

            const stats = calcularGuardiasMes(anio, mesNumero);
            CONFIG.empleados.forEach(emp => {
                const numGuardias = stats[emp.id] || 0;
                csvContent += `"${emp.nombre} (${emp.iniciales})",${numGuardias},${numGuardias * 24}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Guardias_24h_${mesNombre}_${anio}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Listeners de Eventos
        document.getElementById('userSelector').addEventListener('change', (e) => {
            const val = e.target.value;
            state.usuarioActualId = val === 'admin' ? 'admin' : parseInt(val);
            renderizarApp();
        });

        // Inicializar App al cargar ventana
        window.onload = function() {
            cargarEstado();
            renderizarApp();
        };
    </script>
</body>
</html>
